services:
  # S3 compatible store holding the agent config files. The OpAMP Server treats
  # it as the source of truth: configs saved in the admin UI are written here,
  # and configs written here by anything else are synced out to the agents.
  #
  # Point the stack at a real S3 bucket by overriding the OPAMP_S3_* and AWS_*
  # variables below, for example in internal/examples/.env.
  minio:
    # quay.io rather than Docker Hub: MinIO publishes to both, and quay.io is
    # not subject to Docker Hub's anonymous pull rate limits.
    image: quay.io/minio/minio:latest
    container_name: opamp-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${AWS_ACCESS_KEY_ID:-minioadmin}
      MINIO_ROOT_PASSWORD: ${AWS_SECRET_ACCESS_KEY:-minioadmin}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - opamp-network
    restart: unless-stopped

  # Creates the bucket and seeds the fallback config, unless they already exist.
  # Configs stored in the volume survive a restart of the stack, so changes made
  # through the UI are not overwritten by the seed.
  minio-init:
    image: quay.io/minio/mc:latest
    container_name: opamp-minio-init
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${AWS_ACCESS_KEY_ID:-minioadmin}
      MINIO_ROOT_PASSWORD: ${AWS_SECRET_ACCESS_KEY:-minioadmin}
      BUCKET: ${OPAMP_S3_BUCKET:-opamp-configs}
      PREFIX: ${OPAMP_S3_PREFIX:-otel-collector}
    volumes:
      - ./server/configs:/seed:ro
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        mc alias set local http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD"
        mc mb --ignore-existing "local/$$BUCKET"
        if mc stat "local/$$BUCKET/$$PREFIX/config.yaml" >/dev/null 2>&1; then
          echo "Config store already seeded, leaving local/$$BUCKET/$$PREFIX as it is."
        else
          mc cp /seed/config.yaml "local/$$BUCKET/$$PREFIX/config.yaml"
        fi
    networks:
      - opamp-network
    restart: "no"

  opamp-server:
    build:
      context: ../..
      dockerfile: internal/examples/Dockerfile.server
    container_name: opamp-server
    ports:
      - "4320:4320"
      - "4321:4321"
    environment:
      OPAMP_S3_BUCKET: ${OPAMP_S3_BUCKET:-opamp-configs}
      OPAMP_S3_PREFIX: ${OPAMP_S3_PREFIX:-otel-collector}
      OPAMP_S3_ENDPOINT: ${OPAMP_S3_ENDPOINT-http://minio:9000}
      OPAMP_S3_PATH_STYLE: ${OPAMP_S3_PATH_STYLE:-true}
      OPAMP_S3_SYNC_INTERVAL: ${OPAMP_S3_SYNC_INTERVAL:-5s}
      AWS_REGION: ${AWS_REGION:-us-east-1}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-minioadmin}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-minioadmin}
    depends_on:
      minio-init:
        condition: service_completed_successfully
    networks:
      - opamp-network
    restart: unless-stopped

  opamp-agent:
    build:
      context: ../..
      dockerfile: internal/examples/Dockerfile.agent
    entrypoint:
      - "./agent"
      - "--endpoint"
      - "wss://opamp-server:4320/v1/opamp"
      - "--tls-insecure_skip_verify"
    environment:
      # The component and the stack are what the server resolves the agent's
      # config by: <bucket>/<prefix>/<component>/<stack>/config.yaml.
      AGENT_COMPONENT: ${AGENT_COMPONENT:-example-collector}
      AGENT_STACK: ${AGENT_STACK:-dev}
    networks:
      - opamp-network
    depends_on:
      - opamp-server
    restart: unless-stopped
    deploy:
      replicas: 1

networks:
  opamp-network:
    driver: bridge

volumes:
  minio-data:
